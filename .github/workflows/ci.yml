# CAN-X — Continuous Integration baseline (Maintenance CI-01), change-aware since CI-03.
#
# CI is three independent domain gates plus one aggregating gate:
#
#   Change Classification ─┬─→ Runtime / Python      (only if required)
#                          ├─→ Frontend / TypeScript (only if required)
#                          ├─→ Desktop System / Rust (only if required)
#                          └─→ Quality Gate          (ALWAYS runs)
#
# The required status check remains exactly `Quality Gate`. It runs on every
# event, on every repository state, and it fails closed: a domain job the
# classifier marked required must report `success`, an unauthorised skip blocks,
# and a classifier that did not succeed blocks. An authorised skip is therefore
# not a missing validation — the classifier is what authorises it, and the
# classifier is itself a job whose failure the gate observes.
#
# Change classification (CI-03) lives in `tools/ci/classify_changes.py` and the
# gate decision in `tools/ci/evaluate_gate.py`, both standard-library only and
# unit-tested in `tests/unit/ci/`. The workflow deliberately carries no path
# expressions of its own: routing is a tested function, not YAML.
#
# Fail-closed rules, in the classifier:
#   unknown path               → FULL CI
#   diff cannot be established → FULL CI
#   workflow_dispatch          → FULL CI (the manual escape hatch)
#   classifier internal error  → FULL CI, reported as a warning
#
# Tool and dependency versions are never re-declared here — the repository is the source of truth:
#   Python dependencies ... pyproject.toml  ([project] / [project.optional-dependencies].dev)
#   pnpm version .......... package.json    ("packageManager")
#   Rust dependencies ..... apps/desktop/src-tauri/Cargo.lock  (enforced with --locked)
#
# Runner: windows-latest. Windows is CAN-X's primary real development and packaging environment,
# so the CI baseline is pinned to it. This workflow does NOT verify macOS, Linux or real
# CAN hardware — those remain NOT VERIFIED in docs/PROJECT_STATE.md.
#
# Deliberately out of scope here (later maintenance tasks): release publishing, updater, code
# signing, macOS packaging, nightly benchmark, multi-agent task orchestration.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege. CI reads the repository and nothing else: no write, no release, no package
# publish, no deployment, no secret. This workflow needs no project secret.
permissions:
  contents: read

# A new commit on the same branch/PR cancels the superseded run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  change-classifier:
    name: Change Classification
    runs-on: windows-latest
    timeout-minutes: 15
    outputs:
      runtime_required: ${{ steps.classify.outputs.runtime_required }}
      frontend_required: ${{ steps.classify.outputs.frontend_required }}
      rust_required: ${{ steps.classify.outputs.rust_required }}
      full_required: ${{ steps.classify.outputs.full_required }}
      classification: ${{ steps.classify.outputs.classification }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          # The compared commits must both be present: a pull request is diffed
          # from merge-base(base, head) and a push from `before`. An unresolvable
          # commit is not an error to work around — the classifier escalates to
          # FULL CI and the change is still fully validated.
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13.15'

      - name: Classify the change
        id: classify
        shell: pwsh
        env:
          CANX_CI_EVENT: ${{ github.event_name }}
          CANX_CI_PR_BASE: ${{ github.event.pull_request.base.sha }}
          CANX_CI_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          CANX_CI_PUSH_BEFORE: ${{ github.event.before }}
          CANX_CI_PUSH_HEAD: ${{ github.sha }}
        run: python tools/ci/classify_changes.py --github-output $env:GITHUB_OUTPUT

  runtime-python:
    name: Runtime / Python
    needs: change-classifier
    if: needs.change-classifier.outputs.runtime_required == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          # The exact interpreter the Runtime is developed and locally verified against.
          python-version: '3.13.15'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the runtime and its dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Report the toolchain
        run: |
          python --version
          python -m pytest --version
          python -m ruff --version
          python -m mypy --version

      - name: pytest
        run: python -m pytest -q

      - name: ruff
        run: python -m ruff check runtime tests tools

      # `tools/agent` is the AGENT-01 orchestration tooling and `tools/ci` is the
      # CI-03 control plane. Neither is shipped product, but both are type-checked
      # here so they cannot rot outside the gate the rest of the repository is
      # held to.
      - name: mypy
        run: python -m mypy runtime tools/agent tools/ci

  frontend-typescript:
    name: Frontend / TypeScript
    needs: change-classifier
    if: needs.change-classifier.outputs.frontend_required == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # Never wait for an interactive confirmation before fetching the pinned pnpm.
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24.18.0
        uses: actions/setup-node@v7
        with:
          # The exact Node version the desktop is developed and locally verified against.
          node-version: '24.18.0'

      - name: Activate the pnpm declared by package.json
        run: |
          corepack enable
          node --version
          pnpm --version

      - name: Install from the frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: lint
        run: pnpm lint

      - name: typecheck
        run: pnpm typecheck

      - name: test
        run: pnpm test

      - name: build
        run: pnpm build

  desktop-rust:
    name: Desktop System / Rust
    needs: change-classifier
    if: needs.change-classifier.outputs.rust_required == 'true'
    runs-on: windows-latest
    # A cold runner has no Cargo target directory: clippy checks and `cargo test` both build the
    # full Tauri dependency graph from scratch, and the sidecar staging below adds a PyInstaller
    # run. These dominate the job's wall time.
    timeout-minutes: 60
    env:
      # tests/runtime_sidecar.rs returns early when this is unset, so the test would "pass"
      # without ever starting the Python runtime — measured on this tree, it takes 2.27 s with
      # the variable set and 0.00 s without it. The repository's own Rust check
      # (scripts\rust-check.cmd) points it at the same repository-root .venv.
      CANX_TEST_PYTHON: ${{ github.workspace }}\.venv\Scripts\python.exe
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13.15'

      # The repository-root .venv is what scripts\rust-check.cmd and scripts\build-runtime.cmd
      # both expect, so CI reproduces the documented local layout instead of inventing one.
      - name: Create the .venv those scripts expect
        working-directory: .
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install -e ".[dev]"

      # tauri.conf.json declares bundle.externalBin = binaries/canx-runtime, which tauri-build
      # verifies at compile time. That file is a packaging artifact and is gitignored, so on a
      # fresh checkout the crate cannot build at all ("resource path
      # binaries\canx-runtime-x86_64-pc-windows-msvc.exe doesn't exist"). Stage the real sidecar
      # with the repository's own script — never a placeholder — before any cargo command runs.
      - name: Stage the Tauri sidecar (bundle.externalBin precondition)
        working-directory: .
        run: scripts\build-runtime.cmd

      - name: Report the toolchain
        working-directory: .
        run: |
          cargo --version
          rustc --version
          .venv\Scripts\python.exe --version
          echo "CANX_TEST_PYTHON=$env:CANX_TEST_PYTHON"

      # `cargo fmt --check` only — never bare `cargo fmt`, which would silently rewrite the
      # sources and could never fail.
      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: cargo test
        run: cargo test --locked

  quality-gate:
    name: Quality Gate
    needs: [change-classifier, runtime-python, frontend-typescript, desktop-rust]
    # `always()` is load-bearing: the gate must produce a verdict on every run,
    # including the docs-only case where all three domain jobs are legitimately
    # skipped, and including the case where the classifier itself failed.
    if: always()
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13.15'

      - name: Evaluate the gate
        shell: pwsh
        env:
          CANX_CI_CLASSIFIER_RESULT: ${{ needs.change-classifier.result }}
          CANX_CI_CLASSIFICATION: ${{ needs.change-classifier.outputs.classification }}
          CANX_CI_FULL_REQUIRED: ${{ needs.change-classifier.outputs.full_required }}
          CANX_CI_RUNTIME_REQUIRED: ${{ needs.change-classifier.outputs.runtime_required }}
          CANX_CI_FRONTEND_REQUIRED: ${{ needs.change-classifier.outputs.frontend_required }}
          CANX_CI_RUST_REQUIRED: ${{ needs.change-classifier.outputs.rust_required }}
          CANX_CI_RUNTIME_RESULT: ${{ needs.runtime-python.result }}
          CANX_CI_FRONTEND_RESULT: ${{ needs.frontend-typescript.result }}
          CANX_CI_RUST_RESULT: ${{ needs.desktop-rust.result }}
        run: python tools/ci/evaluate_gate.py
