[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "canx-runtime"
version = "0.1.0"
description = "Headless CAN runtime for CAN-X"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "cantools==44.0.0",
  "duckdb==1.5.5",
  "fastapi==0.141.1",
  "msgpack==1.2.2",
  "psutil==7.2.2",
  "pyarrow==21.0.0",
  "pydantic==2.13.5",
  "python-can==4.6.1",
  "uvicorn[standard]==0.53.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "mypy==2.3.1",
  "pyinstaller==6.17.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.7",
]

[project.scripts]
canx-runtime = "canx.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["runtime/canx"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
# "runtime" exposes the shipped runtime package (canx). "." exposes the
# repository-root engineering tooling package (tools.agent), which AGENT-01's
# unit and integration tests import directly. Neither is a shipped artifact.
pythonpath = ["runtime", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
# "runtime" resolves canx. "." resolves the repository-root engineering tooling
# package (tools.agent), which CI type-checks alongside the runtime.
mypy_path = ["runtime", "."]

# pyarrow ships no PEP 561 stubs. The CAN-X data layer still validates the
# Arrow boundary itself (typed models, explicit schemas), so the untyped
# third-party surface is contained to the two adapter modules rather than
# weakening type checking for CAN-X's own code.
[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

